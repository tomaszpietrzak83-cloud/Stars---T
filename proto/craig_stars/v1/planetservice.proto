syntax = "proto3";

package craig_stars.v1;

import "craig_stars/v1/planet.proto";

service PlanetService {
  rpc PreviewShipProduction(ShipProductionRequest) returns (ShipProductionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc QueueShipProduction(ShipProductionRequest) returns (ShipProductionResponse) {}
  rpc GetPlanet(GetPlanetRequest) returns (GetPlanetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdatePlanetOrders(UpdatePlanetOrdersRequest) returns (UpdatePlanetOrdersResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ShipProductionRequest {
  int64 game_id = 1;
  int32 design_num = 2;
  int32 quantity = 3;
  string auto_role = 4;
  bool fill_this_year = 5;
  string expected_source_hash = 6;
}

message ShipyardProduction {
  Planet planet = 1;
  int32 capacity_this_year = 2;
  int32 this_year_quantity = 3;
  int32 later_quantity = 4;
  int32 years_to_complete = 5;
  string reason = 6;
}

message ShipProductionResponse {
  repeated ShipyardProduction yards = 1;
  int32 requested_quantity = 2;
  int32 assigned_quantity = 3;
  int32 this_year_quantity = 4;
  int32 unassigned_quantity = 5;
  string auto_role = 6;
  string source_hash = 7;
  int32 year = 8;
}

message GetPlanetRequest {
  int64 game_id = 1;
  int32 planet_num = 2;
}

message GetPlanetResponse {
  Planet planet = 1;
}

message UpdatePlanetOrdersRequest {
  int64 game_id = 1;
  int32 planet_num = 2;
  PlanetOrders planet_orders = 4;
}

message UpdatePlanetOrdersResponse {
  Planet planet = 1;
}
